services:
  db:
    image: postgres:17-alpine
    container_name: budget_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: budget_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - budget_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budget_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  budget_postgres_data:

